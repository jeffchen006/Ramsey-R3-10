# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/rust/tags/

.latex_compile:
  tags:
    - saas-linux-small-amd64
  image: texlive/texlive:latest-medium

.linux_runner:
  tags:
    - saas-linux-small-amd64
  image: rust:slim

.macos_runner:
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - . "$HOME/.cargo/env"
    # Install cargo binstall and then use it to install cargo nextest
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall cargo-nextest --secure

.windows_runner:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal
    - $env:Path = "$env:USERPROFILE\.cargo\bin"
    # Install cargo nextest
    - $tmp = New-TemporaryFile | Rename-Item -NewName { $_ -replace 'tmp$', 'zip' } -PassThru
    - Invoke-WebRequest -OutFile $tmp https://get.nexte.st/latest/windows-x86
    - $outputDir = if ($Env:CARGO_HOME) { Join-Path $Env:CARGO_HOME "bin" } else { "~/.cargo/bin" }
    - $tmp | Expand-Archive -DestinationPath $outputDir -Force
    - $tmp | Remove-Item

# Optional: Pick zero or more services to be used on all builds.
# Only needed when using a docker container to run your tests in.
# Check out: https://docs.gitlab.com/ee/ci/services/
# services:
#   - mysql:latest
#   - redis:latest
#   - postgres:latest

# Optional: Install a C compiler, cmake and git into the container.
# You will often need this when you (or any of your dependencies) depends on C code.
# before_script:
#   - apt-get update -yqq
#   - apt-get install -yqq --no-install-recommends build-essential

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - linting
  - test
  - docs
  - benchmark

# Check that formatting follows standard
format:
  interruptible: true
  extends:
    - .linux_runner
  stage: linting
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --check --verbose

# Check that there are no warnings from clippy or they are disabled accordingly.
clippy:
  interruptible: true
  extends:
    - .linux_runner
  stage: linting
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --workspace -- -Dwarnings

# Use cargo to test the project on Linux
test-linux:
  interruptible: true
  extends:
    - .linux_runner
  stage: test
  before_script:
    # Install cargo binstall and then use it to install cargo nextest
    - apt-get update && apt-get install --yes curl
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall cargo-nextest --secure
  script:
    - cargo nextest run --workspace --verbose

