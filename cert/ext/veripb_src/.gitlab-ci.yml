benchmark:
  interruptible: true
  extends: .linux_runner
  tags:
    - saas-linux-large-amd64
  stage: benchmark
  timeout: 3h
  rules:
    # Don't run automatically if label "small" or "minor" is given
    - if: '$CI_MERGE_REQUEST_LABELS =~ /(small|minor)/i'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq git xz-utils
    - git config --global --add safe.directory '*'
  script:
    # Build both veripb binaries in parallel using a git worktree for main
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      git worktree add /tmp/veripb-main "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      CARGO_TARGET_DIR=/tmp/target-main cargo build --release --bin veripb --manifest-path /tmp/veripb-main/Cargo.toml &
      BUILD_MAIN_PID=$!
      cargo build --release --bin veripb
      wait $BUILD_MAIN_PID
      cp target/release/veripb /tmp/veripb_branch
      cp /tmp/target-main/release/veripb /tmp/veripb_main
      git worktree remove /tmp/veripb-main

    # Download benchmark dataset via job token
    - >
      curl --fail
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/veripb-ci-benchmarks/1.0.1/small_benchmark_set.tar.xz"
      -o benchmark_data.tar.xz
    - tar -xJf benchmark_data.tar.xz

    # Run both benchmarks in parallel
    - |
      cargo bench --bench veripb-bench -- small_benchmark_set/ --binary /tmp/veripb_main --runs 3 > main.csv &
      MAIN_BENCH_PID=$!
      cargo bench --bench veripb-bench -- small_benchmark_set/ --binary /tmp/veripb_branch --runs 3 > branch.csv
      wait $MAIN_BENCH_PID

    # Compare; exits 1 if average regression >= 20%, also visible in job log via tee
    - cargo build --release --bin compare_benchmarks
    - set -o pipefail; ./target/release/compare_benchmarks main.csv branch.csv | tee comparison.md
  after_script:
    # Post comparison as MR comment
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ] && [ -f comparison.md ]; then
        jq -Rs '{"body": .}' < comparison.md > comment.json \
          && curl --silent --fail --request POST \
               --header "PRIVATE-TOKEN: $BENCHMARK_COMMENT_TOKEN" \
               --header "Content-Type: application/json" \
               --data @comment.json \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          || echo "Note: MR comment posting failed (BENCHMARK_COMMENT_TOKEN may be missing or lack api scope)"
      fi
  artifacts:
    when: always
    paths:
      - main.csv
      - branch.csv
      - comparison.md
    expire_in: 2 weeks

# Build grammar documentation using LaTeX:
build-grammar-doc:
  extends:
    - .latex_compile
  stage: docs
  script:
    - cd docs
    - latexmk -pdf
  artifacts:
    when: on_success
    expose_as: "Grammar PDF"
    name: "docs"
    paths:
      - docs/grammar.pdf
  only:
    changes:
      - docs/grammar.tex
